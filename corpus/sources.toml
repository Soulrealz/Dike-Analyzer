# The taxonomy files carry `##` headings every few lines, which is what the
# chunker keys on. `public-audit-corpus.md` is deliberately NOT included:
# it is a 30-row Markdown table with no per-row heading or finding ID, so
# the whole table would land in one chunk and a citation would point at
# "the table" rather than at a finding.
include_paths = [
  "skill/references/taxonomy/",
  "skill/references/reports/cross-report-patterns.md",
  "skill/references/reports/notable-incidents.md",
  "skill/references/common-false-positives.md",
]

