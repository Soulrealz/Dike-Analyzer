# Corpus manifest. `dike corpus fetch` reads this; `corpus/cache/` (the
# fetched text) is gitignored and never committed.
#
# ---- Refresh rule (living sources) ----------------------------------------
#
# Two of these sources are repositories that gain new findings over time
# (solana-security-standard, solana-audit-taxonomy), and three are live web
# pages. A source that changed between fetches is therefore the normal case,
# not an alarm — but it must be an *observed* case, not an unnoticed one:
#
#   1. Re-fetch before any evaluation run, and otherwise monthly:
#          dike corpus fetch
#      Each source reports `unchanged`, `CHANGED ... grew N bytes`, or
#      `CHANGED ... SHRANK N bytes`. Growth is what new findings look like.
#      A shrink usually means the fetch captured an error or login page —
#      investigate before accepting it.
#   2. Accept the new content deliberately:
#          dike corpus fetch --update-hashes
#      This rewrites `sha256` and `retrieved` here, so the diff of this file
#      is the record of what changed and when.
#   3. Re-index, because the corpus hash has moved:
#          dike corpus index --rebuild
#      `--rebuild` matters here: a source that *removed* a document would
#      otherwise leave its vector in the store.
#   4. In CI, `dike corpus fetch --verify` exits non-zero on any drift, which
#      is how a run pinned to a recorded corpus proves it really used it.
#
# Determinism note: the corpus hash is part of a report's metadata. Two runs
# are only comparable if their corpus hashes match, so re-fetching mid-eval
# invalidates the comparison — do it between runs, never during one.
#
# ---------------------------------------------------------------------------

