# Audit-report sources — still commented out, but for a NEW reason (2026-08-31).
#
# The original blocker was that these URLs pointed at blog *index* pages, which
# fetch as navigation chrome rather than finding text. The user has since
# supplied better sources:
#
#   Zellic  https://reports.zellic.io/  — PDFs mirrored in
#           https://github.com/Zellic/publications/tree/master
#   sec3    https://github.com/sec3-service/reports  (not every report has a PDF)
#   OtterSec https://osec.io/audits  — links out to PDFs
#
# All three are **PDF corpora**, and the fetch pipeline cannot read PDFs:
#   - `kind = "page"`   runs `html_to_text`, which would produce binary noise
#                       from a PDF and nav chrome from an index page;
#   - `kind = "archive"` keeps only `.rs` and `.md` entries out of a tarball,
#                       so a repo of PDFs yields at most its README;
#   - `kind = "local"`   reads `.md` from the working tree.
#
# Enabling these therefore needs a PDF text-extraction step — a new
# `SourceKind`, a new dependency, and an entry in PROJECT_CONTEXT.md — not a
# URL swap. That is a task of its own, not a line in this file.
#
# It may also never be worth doing: the two MIT-licensed Markdown sources
# added above (solana-security-standard, solana-audit-taxonomy) cover the
# same vulnerability classes in a form the chunker handles natively, and
# they are redistributable, which the PDF reports are not.
#
