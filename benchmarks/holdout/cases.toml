path     = "WOOFi_Solana/programs/woofi/src/instructions/admin/create_wooracle.rs"
handler  = "create_wooracle"
class    = "missing-authority-binding"
severity = "medium"
source   = "https://github.com/sherlock-audit/2024-08-woofi-solana-deployment-judging/issues/54"
# Judged M-2, "Missing permission control in create_oracle and create_pool".
# `CreateWooracle` takes `admin: Signer<'info>` and carries no constraint
# binding it to `wooconfig.authority`, so any signer may create an oracle.
# The textbook shape of the class: a signer required, never bound.

