# The real holdout: published findings in real programs, mapped to the exact
# commit that contained them.
#
# ---------------------------------------------------------------------------
# NO CASE GOES IN HERE UNRESOLVED.
# ---------------------------------------------------------------------------
#
# Every entry must come from a disclosure you have actually read, with a commit
# hash you have actually resolved. An invented repository, hash or handler name
# would be a fabricated record: it would look exactly like a real case, produce
# a real-looking number, and there is no way to tell the difference from the
# output. Add cases from verified sources or add none. A holdout of zero cases
# is honest, a holdout of plausible fiction is not.
#
# Two rules, both from the spec (§8), and both enforced by `dike eval holdout`:
#
#   1. This set is touched ONLY AT THE END. Iterating against it is tuning on
#      the test set, and the number stops meaning anything the moment you do.
#      `runs.json` records each scored run; a second run is refused.
#
#   2. Every report of holdout numbers must state the memorization caveat:
#      famous bugs are plausibly in the model's pretraining data, so a Track 2
#      hit here may be recall or may be recitation. The command prints this
#      itself so it cannot be dropped from a summary downstream.
#
# Target size is 15–30 cases. Schema:
#
#   [[case]]
#   id       = "short-stable-slug"          # names the case in every report
#   repo     = "https://github.com/org/repo"
#   commit   = "full 40-character hash"     # the commit that CONTAINED the bug
#   path     = "programs/x/src/lib.rs"      # file the finding sits in
#   handler  = "verify_signatures"          # instruction handler; the unit
#                                           #   findings are compared at (D5)
#   class    = "missing-owner-check"        # one of the classes in
#                                           #   dike-lang-anchor/src/detectors/mod.rs,
#                                           #   or the harness scores a correct
#                                           #   report as a miss
#   severity = "critical"                   # info | low | medium | high | critical
#   source   = "https://…/disclosure"       # the published write-up

# ---------------------------------------------------------------------------
# POPULATED 2026-09-06. Six cases. Every field below was resolved against the
# repository, not recalled: each commit hash is the HEAD the audit or the fix
# actually names, each path and handler was read at that commit, and Dike was
# run over each program to confirm it parses (handler count > 0) before the
# case was written down. Nothing here is reconstructed from memory.
#
# Why six and not fifteen. The intersection of "published finding" x "Anchor
# program" x "public repo at a resolvable commit" is small:
#   - The most-cited Solana disclosures are NATIVE programs, not Anchor.
#     Wormhole's `verify_signatures` is the clearest example. Dike collects
#     handlers only from a `#[program]` module (parser/mod.rs), so a native
#     program yields zero handlers and every case in one would score as an
#     automatic miss - measuring the parser's scope, not detector recall.
#   - Repos disappear. Jet Protocol's `jet-v1` (a real, well-written-up Anchor
#     bug) 404s, so its commit cannot be resolved and the case cannot be made.
#   - Candy Machine v1's history shows a wholesale deprecation commit rather
#     than an isolated security fix, so no single commit "contained the bug"
#     in a way that can be pinned.
# Six verified cases are worth more than twenty plausible ones, and this
# file's own rule says so. Grow the set when new Anchor audit contests
# publish.
#
# The Sherlock cases cite the contest's own judging repo, which mirrors the
# audited code at the commit recorded here and publishes the judged severity.
# Only findings the judges ACCEPTED (the `# Issue H-n/M-n` entries in the
# judging README) are used - those repos also carry every rejected and
# duplicate submission, and scoring against those would be scoring against
# claims nobody validated.
#
# KNOWN CONFLICT with `merge::collapse_by_subject`, found while verifying
# these and not yet resolved. Dike collapses one defect seen from several
# handlers into a single row, naming the absorbed handlers in the evidence.
# This holdout compares at handler granularity (D5). Verified on
# `woofi-create-wooracle-unbound-admin`: Dike DOES report that defect, but
# under `set_oracle_maximum_age`, with `create_wooracle` and `create_pool`
# among 17 absorbed handlers - so a handler-granularity scorer would call it a
# miss on a finding the tool actually made. Whoever implements scoring must
# either match the absorbed handler list too, or make the collapse
# presentation-only. Decide that BEFORE the one scored run: `runs.json`
# refuses a second.

[[case]]
id       = "cashio-print-cash-unvalidated-crate-mint"
repo     = "https://github.com/cashioapp/cashio"
commit   = "a51c3c59d544a5763b64abb4a8d82c49b0abd6d0"
path     = "programs/brrr/src/lib.rs"
handler  = "print_cash"
class    = "removed-guard"
severity = "critical"
source   = "https://github.com/cashioapp/cashio/commit/7df658184c2610139fa2c0058363c66b28add4c4"
# The March 2022 infinite-mint. `BrrrCommon::validate` never checked the
# supplied `crate_mint` against `bank.crate_mint`, so an attacker could pass a
# mint of their own. The fix commit adds exactly one line -
# `assert_keys_eq!(self.bank.crate_mint, self.crate_mint)` - and the commit
# recorded above is its parent, the last commit that still contained the bug.
# `source` is the vendor's own fix rather than a write-up on purpose: the
# widely-linked Sec3 analysis now 404s, and citing a dead link would be citing
# something nobody can read. rekt.news/cashio-rekt/ was reachable as a
# secondary account of the incident.
# Classed `removed-guard`: `crate_mint` is a typed `Account<Mint>`, so Anchor
# proves it is *a* mint and the missing check is an identity constraint rather
# than an owner check. Track 1 has no detector for this class by design (D16).

[[case]]
