name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Deterministic: no model, no GPU, no corpus. Everything here must pass.
  #
  # There is deliberately no `cargo fmt --check` step. The house style is
  # hand-formatted and no rustfmt configuration reproduces it — measured on
  # 2026-09-03, the default disagrees in 257 places and
  # `use_small_heuristics = "Max"` disagrees in 283. Enforcing it would mean a
  # tree-wide reformat that rewrites blame across every file for no behavioural
  # gain, so the gate is clippy, which catches what actually matters here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The eval job's validity gate builds the fixture's Solana dependency
      # tree. Without a cache that is the whole runtime of this workflow.
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny-by-default)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The architectural seam
        run: cargo test -p dike-core --test seam

      # Exit 0 with no findings on correct code is the pass condition, not a
      # formality: a detector that fires here is a false positive on every user.
      # Both mutation sources are clean programs. A finding on either is a
      # false positive on every user — and `escrow` carries the shapes that
      # produced four of them on real code, so a regression there is caught
      # here rather than by the next adjudication.
      - name: Clean fixtures report nothing
        run: |
          cargo run -p dike-cli -- analyze tests/fixtures/programs/vault
          cargo run -p dike-cli -- analyze tests/fixtures/programs/escrow

      # `--work-dir` is deliberately outside `target/`. `Swatinem/rust-cache`
      # caches all of `target/`, and a restored `target/eval/vault` arrives
      # with its children but without the `.dike-eval` marker the harness
      # writes — so the harness refuses to clear a directory it can no longer
      # prove it created, and the job fails before it evaluates anything. It is
      # also just true that eval scratch space is not a build artifact.
      - name: Static eval
        run: |
          cargo run -p dike-cli -- eval run \
            tests/fixtures/programs/vault tests/fixtures/programs/escrow \
            --track static --work-dir "${RUNNER_TEMP}/dike-eval"

      # `eval run` appends to benchmarks/history.json. CI must not commit that —
      # a series entry per push would bury the runs anyone actually cares about.
      - name: The eval series is not modified in CI
        run: git checkout -- benchmarks/history.json

  # The action, end to end, against a fixture that actually has findings —
  # a smoke test over a clean program passes against a renderer that emits an
  # empty document.
  #
  # `upload: false` deliberately. `leaky_vault` is vulnerable on purpose;
  # uploading its SARIF would file permanent code-scanning alerts against this
  # repository for a fixture nobody intends to fix, and every contributor
  # would have to learn to ignore them. The cost is that the upload step is
  # not exercised here — it is a four-line `uses:` of a Microsoft-maintained
  # action, and the README's consumer example covers it.
  action-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # No job-level Swatinem/rust-cache step here: `uses: ./` runs the action
      # against this job's own checkout, so `github.action_path` is this
      # repository root — the same workspace the action's own internal
      # rust-cache step (keyed the same way) already caches. A second step
      # here would race it on an identical cache key.

      - name: Run the action
        uses: ./
        with:
          path: tests/fixtures/programs/leaky_vault
          sarif-file: dike.sarif
          upload: false

      - name: The SARIF is well formed and reports the fixture's classes
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json
          doc = json.load(open("dike.sarif"))
          assert doc["version"] == "2.1.0", doc.get("version")
          assert "sarif" in doc["$schema"]
          run = doc["runs"][0]
          assert run["invocations"][0]["executionSuccessful"] is True
          ids = {r["ruleId"] for r in run["results"]}
          expected = {
              "missing-signer",
              "missing-owner-check",
              "missing-authority-binding",
              "pda-validation-gap",
              "unchecked-arithmetic",
              # 7 results / 5 rules -> 8 / 6 on 2026-09-19: `removed-guard`
              # gained a rule for an account that moves value, is named after
              # state the handler writes, and is unpinned. `vault_token` is
              # that account in both `deposit` and `withdraw`, and
              # `collapse_by_subject` folds them into one row.
              "removed-guard",
          }
          assert ids == expected, f"got {sorted(ids)}"
          assert len(run["results"]) == 8, len(run["results"])
          assert len(run["tool"]["driver"]["rules"]) == 6
          for r in run["results"]:
              physical = r["locations"][0]["physicalLocation"]
              uri = physical["artifactLocation"]["uri"]
              assert not uri.startswith("/"), uri
              # A startLine of 0 is schema-invalid, and upload-sarif validates
              # before ingesting: one bad line would reject the whole document
              # and discard every other finding in the run.
              region = physical.get("region")
              assert region is None or region["startLine"] >= 1, region
              # An empty fingerprint is not a missing one. Two results of a
              # rule sharing "" are one alert to code scanning, so the second
              # disappears — the key is omitted instead.
              fingerprints = r.get("partialFingerprints", {})
              assert fingerprints.get("dikeFindingId/v1") != "", r["ruleId"]
          print(f"ok: {len(run['results'])} results, {len(run['tool']['driver']['rules'])} rules")
          EOF

  # Optional, and never a reason for a red build: it needs a key that forks and
  # most contributors do not have. Track 2's own model runs locally and GitHub
  # runners have no GPU, so a hosted frontier model is the only way to
  # exercise the LLM path in CI at all.
  llm-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: check
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Skip without a key
        id: key
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "no GEMINI_API_KEY; skipping the LLM smoke check"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Track 2 also needs an indexed corpus, which needs an embedding model.
      # Until that is available to a runner this stays a build-and-wire check
      # rather than a scored eval: it proves the LLM path compiles and is
      # reachable, and says so rather than pretending to be a measurement.
      - name: Build the LLM path
        if: steps.key.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cargo build -p dike-cli
